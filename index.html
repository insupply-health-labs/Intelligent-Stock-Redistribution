<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intelligent Stock Redistribution Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* inSupply Health design system tokens */
  --navy:#1c3557; --navy-overlay:rgba(28,53,87,0.6); --red:#e73846; --logo-grey:#909b9c;
  --border-light:#c9d7e4; --sand:#eae4dc; --surface:#ffffff; --on-dark:#ffffff; --ink:#000000;
  --body-text:#666666; --header-divider:#d7d7d7;
  --space-1:8px; --space-2:10px; --space-3:20px; --space-4:30px; --space-5:54px; --rule-heavy:3px;
  --radius-sm:3px; --radius-card:6px; --radius-round:50%;
  --shadow-header:0 2px 10px rgba(0,0,0,0.3); --shadow-disc:0 1px 4px rgba(0,0,0,0.12);
  --font:Montserrat,"Helvetica Neue",Arial,sans-serif;
  /* roles (light) */
  --bg:var(--surface); --panel:var(--surface); --alt:var(--sand); --text:var(--navy); --text-2:var(--body-text);
  --line:var(--border-light); --hair:var(--header-divider); --brand:var(--navy); --on-brand:var(--on-dark);
  --act:var(--red); --on-act:var(--on-dark); --tint:#eef3f8; --band:var(--border-light);
  --low:var(--red); --low-tint:#fdecee; --warn:#f28c28; --warn-text:#a34a06; --warn-tint:#fff1e3; --sur:var(--navy); --sur-tint:#e6edf5; --muted-dot:#b9c6d4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1726; --panel:#13233a; --alt:#1a2b44; --text:#e6edf5; --text-2:#a9b8ca; --line:#2c4262; --hair:#24385a;
  --brand:#2b4d7d; --on-brand:#ffffff; --act:#e73846; --on-act:#ffffff; --tint:#182a44; --band:#2c4262;
  --low:#ff7781; --low-tint:#3a1d26; --warn:#f5a04a; --warn-text:#ffb877; --warn-tint:#3a2a17; --sur:#9fc0e6; --sur-tint:#1b3150; --muted-dot:#3b5578;
}}
:root[data-theme="dark"]{
  --bg:#0c1726; --panel:#13233a; --alt:#1a2b44; --text:#e6edf5; --text-2:#a9b8ca; --line:#2c4262; --hair:#24385a;
  --brand:#2b4d7d; --on-brand:#ffffff; --act:#e73846; --on-act:#ffffff; --tint:#182a44; --band:#2c4262;
  --low:#ff7781; --low-tint:#3a1d26; --warn:#f5a04a; --warn-text:#ffb877; --warn-tint:#3a2a17; --sur:#9fc0e6; --sur-tint:#1b3150; --muted-dot:#3b5578;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:400 14px/1.55 var(--font);-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--panel);box-shadow:var(--shadow-header)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-3);padding-top:var(--space-2);padding-bottom:var(--space-2)}
.logo{background:var(--surface);border-radius:var(--radius-sm);padding:2px 6px;display:flex}
.logo img{height:34px;width:auto;display:block}
.appname{font-weight:700;font-size:15px;line-height:1.2;margin-right:auto}
.appname small{display:block;font-weight:500;font-size:11px;color:var(--text-2)}
.actas{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1);font-size:13px}
.actas label{font-weight:600}
select,input[type=number],input[type=text],textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px var(--space-1);max-width:100%}
.actas select{max-width:240px}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--hair)}
.tab{flex:1 0 auto;border:0;background:none;padding:var(--space-2) var(--space-1);font-weight:600;font-size:13px;color:var(--text-2);border-bottom:var(--rule-heavy) solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center}
.tab .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:var(--radius-round);border:1.5px solid currentColor;font-size:12px}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--act)}
.tab .badge{background:var(--act);color:var(--on-act);border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}

main{padding:var(--space-3) 0 var(--space-5)}
@media (max-width:640px){.top{position:static}.logo img{height:28px}}
h1{font-size:clamp(22px,4.5vw,30px);line-height:1.2;margin:0 0 6px;font-weight:700}
h2{font-size:18px;line-height:1.3;margin:var(--space-4) 0 var(--space-2);font-weight:700}
h3{font-size:16px;line-height:1.3;margin:0;font-weight:700}
p{margin:0 0 var(--space-2)}
.lede{color:var(--text-2);max-width:68ch;margin-bottom:var(--space-3)}
.muted{color:var(--text-2)}
.small{font-size:12.5px}
.rule{width:56px;height:var(--rule-heavy);background:var(--brand);margin:var(--space-1) 0 var(--space-3)}

/* labels for mocked / assumed */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:1.3;padding:2px 7px;border-radius:var(--radius-sm);border:1px dashed var(--text-2);color:var(--text-2);background:transparent;vertical-align:middle}
.tag.ai{border-style:solid;border-color:var(--brand);color:var(--text);background:var(--sur-tint)}
.tag.mock{border-color:var(--act);color:var(--text)}

/* buttons */
.btn{border:0;border-radius:var(--radius-sm);padding:var(--space-1) 18px;font-weight:600;font-size:14px;line-height:23px;cursor:pointer;background:var(--act);color:var(--on-act);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn.quiet{background:transparent;color:var(--text);padding:6px var(--space-2);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:var(--space-1);align-items:center}

/* thresholds legend */
.legend{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);background:var(--alt);border-radius:var(--radius-card);padding:var(--space-2) var(--space-3);font-size:12.5px;margin-bottom:var(--space-3)}
.legend b{font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:var(--radius-round);margin-right:5px;vertical-align:-1px}

.hint{border-left:var(--rule-heavy) solid var(--brand);padding:var(--space-1) var(--space-2);background:var(--tint);margin-bottom:var(--space-3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--brand)}

/* alerts */
.alerts{display:grid;gap:var(--space-2)}
.alert{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--radius-card);padding:var(--space-2) var(--space-3)}
.alert.out{border-left-color:var(--low)}
.alert.low{border-left-color:var(--warn)}
.alert.sur{border-left-color:var(--sur)}
.alert .item{font-weight:700;font-size:15px;line-height:1.3}
.alert .meta{font-size:12.5px;color:var(--text-2)}
.status{font-weight:700;font-size:12px;padding:1px 7px;border-radius:var(--radius-sm);white-space:nowrap}
.status.out{background:var(--low-tint);color:var(--low)}
.status.low{background:var(--warn-tint);color:var(--warn-text)}
.status.sur{background:var(--sur-tint);color:var(--sur)}
.status.other{background:var(--alt);color:var(--text)}
.source{font-size:12.5px;font-weight:600;margin-top:4px}
.source.yes{color:var(--text)}
.source.no{color:var(--text-2);font-weight:500}
@media (max-width:560px){.alert{grid-template-columns:1fr}.alert .act{justify-self:start}}

/* gauge: months of stock against the 3–6 month band */
.gauge{position:relative;height:16px;margin:6px 0 2px;max-width:420px}
.gauge .track{position:absolute;left:0;right:0;top:6px;height:4px;background:var(--hair);border-radius:2px}
.gauge .band{position:absolute;top:3px;height:10px;background:var(--band);border-radius:2px}
.gauge .mark{position:absolute;top:0;width:4px;height:16px;border-radius:2px;transform:translateX(-2px)}
.gauge .over{position:absolute;right:-2px;top:-1px;font-size:11px;font-weight:700}
.gscale{position:relative;height:14px;max-width:420px;font-size:10.5px;line-height:14px;color:var(--text-2)}
.gscale span{position:absolute;top:0;transform:translateX(-50%)}
.gscale span:first-child{transform:none}.gscale span:last-child{transform:none;left:auto!important;right:0}

/* suggestions */
.need{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-3);background:var(--brand);color:var(--on-brand);border-radius:var(--radius-card);padding:var(--space-3);margin-bottom:var(--space-3)}
.need .k{font-size:12px;opacity:.85}
.need .v{font-size:20px;font-weight:700;line-height:1.2}
.need .facts{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4)}
.need .btn.sec{color:var(--on-brand);box-shadow:inset 0 0 0 1.5px var(--on-brand)}
@media (max-width:560px){.need{grid-template-columns:1fr}}
.sgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--space-3);align-items:start}
@media (max-width:820px){.sgrid{grid-template-columns:1fr}}
.cards{display:grid;gap:var(--space-2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--space-3)}
.card.top1{border:2px solid var(--brand)}
.card .head{display:flex;gap:var(--space-2);align-items:flex-start}
.rank{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:var(--radius-round);background:var(--brand);color:var(--on-brand);font-weight:700}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--space-1) var(--space-3);margin:var(--space-2) 0}
.fig .k{font-size:11.5px;color:var(--text-2);line-height:1.3}
.fig .v{font-size:16px;font-weight:700;line-height:1.3}
.fig .s{font-size:11.5px;color:var(--text-2);line-height:1.3}
.reason{border-top:1px solid var(--hair);padding-top:var(--space-1);margin-top:var(--space-1);font-size:13.5px}
.reason .who{font-weight:700}
.thinking{display:inline-flex;gap:6px;align-items:center;color:var(--text-2)}
.thinking i{width:6px;height:6px;border-radius:var(--radius-round);background:var(--brand);animation:pulse 1.2s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.7}}
.orders{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);background:var(--alt);border-radius:var(--radius-card);padding:var(--space-2) var(--space-3);font-size:13px;margin-bottom:var(--space-2)}
.orders ol{margin:4px 0 0;padding-left:20px}
.orders .agree{grid-column:1/-1;font-weight:600;font-size:12.5px}
.empty{background:var(--alt);border-radius:var(--radius-card);padding:var(--space-3);}
.empty strong{display:block;font-size:17px;margin-bottom:4px}
.left-out{font-size:12.5px;color:var(--text-2);margin-top:var(--space-2)}
.left-out li{margin-bottom:2px}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--space-2)}
.mapbox svg{display:block;width:100%;height:auto}
.mapcap{font-size:11.5px;color:var(--text-2);margin-top:6px}

/* requests */
.req{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--space-3);margin-bottom:var(--space-2)}
.req .title{display:flex;flex-wrap:wrap;gap:var(--space-1);align-items:baseline;justify-content:space-between}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin:var(--space-2) 0;padding:0;list-style:none;counter-reset:s}
.steps li{flex:1 1 120px;font-size:12px;padding:6px var(--space-1);border-radius:var(--radius-sm);background:var(--alt);color:var(--text-2);counter-increment:s}
.steps li::before{content:counter(s) ". ";font-weight:700}
.steps li.done{background:var(--sur-tint);color:var(--text)}
.steps li.now{background:var(--brand);color:var(--on-brand);font-weight:600}
.steps li.bad{background:var(--low-tint);color:var(--low);font-weight:600}
.form{display:grid;gap:var(--space-2);max-width:520px}
.form label{font-weight:600;font-size:13px;display:grid;gap:4px}
.form .help{font-weight:400;font-size:12px;color:var(--text-2)}
.panel{background:var(--alt);border-radius:var(--radius-card);padding:var(--space-3);margin:var(--space-2) 0}
.log{font-size:12px;color:var(--text-2);margin:var(--space-1) 0 0;padding-left:18px}
.who-note{font-size:12.5px;background:var(--tint);border-radius:var(--radius-sm);padding:6px var(--space-2);margin:var(--space-1) 0}
.outbox{background:var(--panel);border:1.5px dashed var(--act);border-radius:var(--radius-card);padding:var(--space-2) var(--space-3);font-size:13px;white-space:pre-wrap;margin-top:var(--space-1)}
.banner{font-size:12.5px;background:var(--low-tint);color:var(--text);border-radius:var(--radius-sm);padding:6px var(--space-2);margin-bottom:var(--space-2)}
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th,.table td{text-align:left;padding:4px 8px 4px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.scrollx{overflow-x:auto}
details{background:var(--alt);border-radius:var(--radius-card);padding:var(--space-2) var(--space-3);margin-top:var(--space-4)}
details summary{cursor:pointer;font-weight:700}
details .table{margin-top:var(--space-1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

  "District Hospital": ["District Hospital","Health Centre","Dispensary"],
  "Health Centre": ["Health Centre","Dispensary"],
  "Dispensary": ["Health Centre","Dispensary"]
};
const W = { cover:0.5, dist:0.3, expiry:0.2 }; // rule-based score weights

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-US");
const fmt1 = n => (Math.round(n*10)/10).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
const tsh = n => "Tsh " + fmt(n);
const canon = n => n.replace(/\bDisp\.\s+/g, "Dispensary ").replace(/\s+/g," ").trim();
const parseDate = s => { const [m,d,y] = s.split("/").map(Number); return new Date(y, m-1, d); };
const fmtDate = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const monthsBetween = (a,b) => (b - a) / (1000*60*60*24*30.4375);
function hav(a, b){
  const toR = x => x*Math.PI/180, Rk = 6371;
  const dLat = toR(b.lat-a.lat), dLon = toR(b.lon-a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
  return 2*Rk*Math.asin(Math.sqrt(h));
}
const roadKm = (a,b) => Math.round(hav(a,b)*R.ROAD*10)/10;   // estimated road distance, 0.1 km
const transport = km => Math.round(km*2*R.RATE);              // return trip

/* ---------- data rules (readiness report fixes 1–4) ---------- */
const skipped = [], merged = [];
const facilities = new Map(); // canonical name -> {name, level, lat, lon}
const rows = [];
const seen = new Map();
for (const r of RAW){
  const [csvRow, fname, level, item, unit, exp, soh, amc, batch, lat, lon] = r;
  if (!item){ skipped.push({csvRow, fname, why:"Empty apart from facility name and coordinates"}); continue; }
  const fac = canon(fname);
  const key = [fac, item, batch, exp, soh].join("|");
  if (seen.has(key)){ merged.push({csvRow, fname, into: fac, intoRow: seen.get(key)}); continue; }
  seen.set(key, csvRow);
  if (!facilities.has(fac)) facilities.set(fac, {name:fac, level: level || null, lat, lon});
  const expiry = exp ? parseDate(exp) : null;
  const o = {csvRow, fac, item, unit, batch, expiry, soh, amc, missing: soh==null || amc==null || amc===0};
  if (!o.missing){
    o.mos = soh/amc;
    o.mtx = expiry ? monthsBetween(SNAPSHOT, expiry) : null;
    o.expired = expiry ? expiry < SNAPSHOT : false;
    o.unusable = o.expired ? soh : Math.max(0, soh - amc*Math.max(0, o.mtx));
    if (o.mos > R.CHECK) o.status = "check";
    else if (soh === 0) o.status = "stockout";
    else if (o.mos < R.LOW) o.status = "low";
    else if (o.expired) o.status = "expired";
    else if (o.mos > R.MAX || o.unusable > 0) o.status = "surplus";
    else o.status = "ok";
    o.spare = o.status === "surplus" ? Math.floor(Math.max(soh - R.MAX*amc, o.unusable)) : 0;
  } else o.status = "missing";
  rows.push(o);
}
const facOf = n => facilities.get(n);

/* ---------- matching (P2): filters, cap, rule-based score ---------- */
function sourcesFor(need){
  const recv = facOf(need.fac);
  const needQty = Math.max(0, Math.ceil(R.MAX*need.amc - need.soh)); // top up to the 6-month maximum
  const out = [], leftOut = {far:0, level:0, cap:0, expired:0, check:0};
  let nearestFar = null, nearestStock = null;   // shown only when nothing is in reach; never suggested
  for (const s of rows){
    if (s.item !== need.item || s.fac === need.fac) continue;
    if (s.status === "expired" || (s.expired && s.soh>0)) { leftOut.expired++; continue; }
    if (s.status === "check") { leftOut.check++; continue; }
    const src = facOf(s.fac);
    const km = roadKm(recv, src);
    if (!s.missing && s.soh > 0 && (!nearestStock || km < nearestStock.km)) nearestStock = {row:s, src, km};
    if (s.status !== "surplus" || s.spare <= 0) continue;
    const lvlKnown = src.level && recv.level;
    if (lvlKnown && !(MAY_SUPPLY[src.level]||[]).includes(recv.level)){ leftOut.level++; continue; }
    const usable = Math.floor(need.amc * Math.max(0, s.mtx));   // receiving facility can use before this batch expires
    const offer = Math.min(s.spare, usable, needQty);
    if (offer <= 0){ leftOut.cap++; continue; }
    if (km > R.MAXKM){ leftOut.far++; if (!nearestFar || km < nearestFar.km) nearestFar = {row:s, src, km, cost:transport(km), offer}; continue; }
    const cover = needQty ? offer/needQty : 0;
    const urgency = s.mtx <= 6 ? 1 : s.mtx <= 12 ? 0.5 : 0;
    const score = W.cover*cover + W.dist*(1 - km/R.MAXKM) + W.expiry*urgency;
    out.push({id:"", row:s, src, km, cost:transport(km), offer, usable, needQty, cover, urgency, score, levelUnknown:!lvlKnown});
  }
  out.sort((a,b)=> b.score - a.score);
  out.forEach((c,i)=> c.id = "S"+(i+1));
  return {list:out, leftOut, needQty, nearestFar, nearestStock};
}
const needRows = rows.filter(r => r.status==="stockout" || r.status==="low");
const matchCache = new Map();
const match = r => { if(!matchCache.has(r.csvRow)) matchCache.set(r.csvRow, sourcesFor(r)); return matchCache.get(r.csvRow); };
const bestCount = f => Math.max(0, ...needRows.filter(r => r.fac===f).map(r => match(r).list.length));
const facsWithSource = [...new Set(needRows.filter(r => match(r).list.length).map(r => r.fac))]
  .sort((a,b)=> bestCount(b)-bestCount(a) || a.localeCompare(b));

/* ---------- state ---------- */
const state = {
  tab: "alerts",
  fac: facsWithSource[0] || [...facilities.keys()].sort()[0],
  role: "staff",
  alertRow: null,      // csvRow of the alert being acted on
  pick: null,          // chosen candidate id for request
  ai: {},              // csvRow -> {status, order, reasons, note}
  requests: [],
  store: "loading",    // loading | shared | local
  canWrite: true,
  draftQty: null,
  noteDrafts: {}       // unsent edits to pickup messages, kept in this tab until sent
};
try { const s = JSON.parse(localStorage.getItem("sdp-acting-as-v2")||"null"); if (s && facilities.has(s.fac)) { state.fac = s.fac; state.role = s.role || "staff"; } } catch(e){}
function rememberActing(){ try { localStorage.setItem("sdp-acting-as-v2", JSON.stringify({fac:state.fac, role:state.role})); } catch(e){} }

/* ---------- shared request storage (P3/P4) ---------- */
let col = null;
const local = new Map();
async function initStore(){
  const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  let db = null, user = null;
  try { db = use ? await use("db") : null; } catch(e){ db = null; }
  try { user = use ? await use("user") : null; } catch(e){ user = null; }
  if (user){ try { const c = await user.can("data.write"); if (c === false) state.canWrite = false; } catch(e){} }
  if (!db){ state.store = "local"; render(); return; }
  try {
    col = db.collection("requests");
    col.onSnapshot(snap => {
      state.requests = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=> (b.created||0)-(a.created||0));
      state.store = "shared"; render();
    }, err => { col = null; state.store = "local"; render(); });
  } catch(e){ col = null; state.store = "local"; render(); }
}
function syncLocal(){ state.requests = [...local.values()].sort((a,b)=> (b.created||0)-(a.created||0)); render(); }
async function addRequest(data){
  if (col){ try { const ref = await col.add(data); return ref.id; } catch(e){ return failWrite(e); } }
  const id = "r" + Date.now().toString(36); local.set(id, {id, ...data}); syncLocal(); return id;
}
async function patchRequest(id, patch){
  const cur = state.requests.find(r => r.id===id); if (!cur) return;
  const next = {...patch, log: [...(cur.log||[]), patch._log].filter(Boolean)}; delete next._log;
  if (col){ try { await col.doc(id).update(next); } catch(e){ failWrite(e); } return; }
  local.set(id, {...local.get(id), ...next}); syncLocal();
}
function failWrite(e){
  if (e && e.code === "invalid_argument") state.canWrite = false;
  toast(e && e.code === "quota_exceeded" ? "Storage is full, so the request was not saved." : "The request could not be saved. Try again in a moment.");
  render(); return null;
}
let toastTimer;
function toast(msg){ let t = $("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status");
  t.style.cssText="position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:8px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;z-index:50;max-width:90vw"; document.body.appendChild(t);} 
  t.textContent = msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, 3200); }

/* ---------- Claude ranking (P2 · the judgment) ---------- */
let samplePromise = null;
function getSample(){ if (!samplePromise){ const use = window.claude && window.claude.use; samplePromise = use ? window.claude.use("sample").catch(()=>null) : Promise.resolve(null); } return samplePromise; }
async function askClaude(need){
  const key = need.csvRow; const m = match(need);
  if (!m.list.length || state.ai[key]?.status === "thinking" || state.ai[key]?.status === "done") return;
  state.ai[key] = {status:"thinking"}; render();
  const sample = await getSample();
  if (!sample){ state.ai[key] = {status:"off", note:"Claude isn't available in this view, so the rule-based order is shown."}; render(); return; }
  const recv = facOf(need.fac);
  const lines = m.list.map(c => `${c.id}: level ${c.src.level||"unknown"}; spare ${c.row.spare} ${need.unit}; can offer ${c.offer} (capped so the receiver uses it before expiry and stays at or under ${R.MAX} months); estimated road distance ${c.km} km; return transport cost ${c.cost} Tsh; this batch expires in ${fmt1(c.row.mtx)} months; source holds ${fmt1(c.row.mos)} months of stock.`).join("\n");
  const prompt = `You help staff at a health facility in Tanzania choose which nearby facility to ask for a commodity they are short of. Weigh the trade-offs: covering the need, distance and transport cost, and taking stock that would otherwise expire unused at the source.

Commodity: ${need.item}
Receiving facility: level ${recv.level||"unknown"}; ${fmt1(need.mos)} months of stock; needs ${m.needQty} ${need.unit} to reach ${R.MAX} months; uses ${need.amc} a month.

Candidate sources (already filtered: within ${R.MAXKM} km, allowed by level, not expired):
${lines}

Rule-based order (weighted score): ${m.list.map(c=>c.id).join(", ")}

Return JSON only, no other text: {"order":["S1",...every candidate id exactly once],"reasons":{"S1":"..."}}.
Each reason is ONE plain sentence of at most 25 words saying why this source sits where it does, written for facility staff. Do not write any digits or numbers in the reasons; describe qualities instead (closer, more spare stock, expires sooner, covers the full need). Reorder only where the trade-off justifies it.`;
  try {
    const out = await sample.json(prompt, {modelTier:"quick"});
    const ids = m.list.map(c=>c.id);
    let order = Array.isArray(out?.order) ? out.order.filter(x => ids.includes(x)) : [];
    let note = "";
    if (order.length !== ids.length || new Set(order).size !== ids.length){ order = ids; note = "Claude's order was incomplete, so the rule-based order is shown."; }
    const reasons = {}; let stripped = false;
    for (const c of m.list){
      const t = String(out?.reasons?.[c.id] || "").trim();
      if (!t || /\d/.test(t)){ reasons[c.id] = templateReason(c, m.list); if (t) stripped = true; }
      else reasons[c.id] = t;
    }
    if (stripped) note = (note ? note+" " : "") + "One of Claude's sentences contained figures, so the tool's own reason replaces it.";
    state.ai[key] = {status:"done", order, reasons, note};
  } catch(e){
    const msg = e?.code === "not_granted" ? "Claude was not allowed in this view, so the rule-based order is shown."
      : e?.code === "rate_limited" ? "Claude is busy. The rule-based order is shown; try again in a minute."
      : "Claude didn't answer, so the rule-based order is shown.";
    state.ai[key] = {status:"error", note:msg, retry: e?.code !== "not_granted"};
  }
  render();
}
function templateReason(c, list){
  const parts = [];
  if (c.cover >= 0.999) parts.push("covers the full need"); else parts.push("covers part of the need");
  const minKm = Math.min(...list.map(x=>x.km)); if (c.km === minKm) parts.push("is the closest option");
  if (c.urgency === 1) parts.push("takes stock that expires soon at the source");
  return "Tool's reason: " + parts.join(", ") + ".";
}

/* ---------- rendering ---------- */
const TABS = [["alerts","Alerts"],["sugg","Suggestions"],["req","Request and approval"],["xfer","Transfer"]];
function myRequests(){ return state.requests.filter(r => r.toFac===state.fac || r.fromFac===state.fac); }
function pendingFor(tab){
  const mine = myRequests();
  if (tab==="req") return mine.filter(r => (r.fromFac===state.fac && ((state.role==="staff" && r.status==="sent") || (state.role==="incharge" && r.status==="accepted")))).length;
  if (tab==="xfer") return mine.filter(r => r.status==="approved" && r.transfer!=="received").length;
  return 0;
}
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l],i)=>{
    const b = pendingFor(k);
    return `<button class="tab" role="tab" aria-selected="${state.tab===k}" data-tab="${k}"><span class="n">${i+1}</span>${l}${b?`<span class="badge" aria-label="${b} waiting">${b}</span>`:""}</button>`;
  }).join("");
}
function renderActing(){
  const sel = $("#asFac");
  if (!sel.options.length){
    const names = [...facilities.keys()].sort();
    sel.innerHTML = names.map(n=>`<option>${esc(n)}</option>`).join("");
  }
  sel.value = state.fac; $("#asRole").value = state.role;
}
function gauge(o){
  const max = 12, v = Math.min(o.mos, max), pct = x => (x/max*100)+"%";
  const col = o.status==="stockout" ? "var(--low)" : o.status==="low" ? "var(--warn)" : o.status==="surplus" ? "var(--sur)" : "var(--text-2)";
  return `<div class="gauge" aria-hidden="true"><div class="track"></div><div class="band" style="left:${pct(R.LOW)};width:${pct(R.MAX-R.LOW)}"></div>
    <div class="mark" style="left:${pct(v)};background:${col}"></div>${o.mos>max?`<span class="over" style="color:${col}">›</span>`:""}</div>
    <div class="gscale" aria-hidden="true"><span style="left:0">0</span><span style="left:${pct(R.LOW)}">${R.LOW}</span><span style="left:${pct(R.MAX)}">${R.MAX}</span><span>12+ months</span></div>`;
}
const STATUS_TEXT = {stockout:"Stock-out", low:"Low", surplus:"Surplus", expired:"Expired", check:"Check quantity", missing:"Data missing", ok:"OK"};
function statusClass(s){ return s==="stockout" ? "out" : s==="low" ? "low" : s==="surplus" ? "sur" : "other"; }

function viewAlerts(){
  const f = facOf(state.fac);
  const mine = rows.filter(r => r.fac===state.fac);
  const needs = mine.filter(r => r.status==="stockout"||r.status==="low").sort((a,b)=> (a.soh===0?-1:0)-(b.soh===0?-1:0) || a.mos-b.mos);
  const others = mine.filter(r => !["stockout","low","ok"].includes(r.status));
  const ok = mine.filter(r => r.status==="ok");
  const card = o => {
    const sc = statusClass(o.status);
    let detail = "", act = "";
    if (o.status==="missing") detail = `<div class="meta">Can't calculate — stock on hand or monthly consumption is missing in EMR.</div>`;
    else {
      detail = `${gauge(o)}<div class="meta">${fmt(o.soh)} ${esc(o.unit)} in stock, uses ${fmt(o.amc)} a month, <b>${fmt1(o.mos)} months of stock</b>. Batch ${esc(o.batch)} expires ${fmtDate(o.expiry)}${o.expired?" (already expired)":""}.</div>`;
    }
    if (sc==="low"||sc==="out"){
      const m = match(o);
      detail += m.list.length ? `<div class="source yes">Source within ${R.MAXKM} km: ${m.list.length} ${m.list.length>1?"facilities":"facility"}</div>`
        : `<div class="source no">No nearby facility can spare this.</div>`;
      act = `<div class="act"><button class="btn${m.list.length?"":" sec"}" data-open="${o.csvRow}">${m.list.length?"See sources":"See why"}</button></div>`;
    } else if (o.status==="surplus"){
      detail += `<div class="source no">${fmt(o.spare)} ${esc(o.unit)} could be spared. Offering it to others is not part of this prototype.</div>`;
    } else if (o.status==="expired"){
      detail += `<div class="source no">Expired — not available to redistribute.</div>`;
    } else if (o.status==="check"){
      detail += `<div class="source no">Above ${R.CHECK} months of stock. Not suggested to others until someone confirms the quantity.</div>`;
    }
    return `<div class="alert ${sc}"><div><div class="row"><span class="status ${sc}">${STATUS_TEXT[o.status]}</span><span class="item">${esc(o.item)}</span></div>${detail}</div>${act}</div>`;
  };
  const dupNote = merged.filter(m => m.into===state.fac).length ? `<div class="hint">EMR holds a duplicate record of this facility under an abbreviated name. It has been merged here, so it is never suggested as a separate source.</div>` : "";
  return `<h1>Alerts for ${esc(state.fac)}</h1><div class="rule"></div>
  <p class="lede">${esc(f.level||"Level unknown")}. Commodities flagged from the EMR stock snapshot of ${fmtDate(SNAPSHOT)}. Pick a low or stocked-out item to find a nearby facility that can spare it.</p>
  <div class="legend" aria-label="How items are flagged">
    <span><span class="dot" style="background:var(--low)"></span><b>Stock-out</b> 0 in stock</span>
    <span><span class="dot" style="background:var(--warn)"></span><b>Low</b> below ${R.LOW} months</span>
    <span><span class="dot" style="background:var(--band)"></span><b>Target</b> ${R.LOW}–${R.MAX} months</span>
    <span><span class="dot" style="background:var(--sur)"></span><b>Surplus</b> above ${R.MAX} months, or won't be used before expiry</span>
    <span><b>Check quantity</b> above ${R.CHECK} months</span>
    <span class="muted">Months of stock = stock on hand ÷ average monthly consumption</span>
  </div>
  ${dupNote}
  ${facsWithSource.length ? `<div class="hint">In this synthetic data, only these facilities have a low item with a source within ${R.MAXKM} km:<div class="chips">${facsWithSource.map(n=>`<button class="chip" data-fac="${esc(n)}">${esc(n)} (${bestCount(n)} ${bestCount(n)>1?"sources":"source"})</button>`).join("")}</div></div>`:""}
  <h2>Needs action (${needs.length})</h2>
  <div class="alerts">${needs.length? needs.map(card).join("") : `<div class="empty"><strong>Nothing is low or stocked out here.</strong>Choose another facility under “Acting as”.</div>`}</div>
  ${others.length?`<h2>Other flags (${others.length})</h2><div class="alerts">${others.map(card).join("")}</div>`:""}
  ${ok.length?`<p class="muted small" style="margin-top:var(--space-3)">${ok.length} other ${ok.length>1?"items are":"item is"} within ${R.LOW}–${R.MAX} months.</p>`:""}
  ${aboutPanel()}`;
}

function mapSvg(need, list, order){
  const recv = facOf(need.fac);
  const W_ = 360, H_ = 300, cx = W_/2, cy = H_/2;
  const ringKm = R.MAXKM / R.ROAD;            // 50 km road ≈ 35.7 km straight
  const pxPerKm = (H_/2 - 18) / ringKm;
  const kx = 111.32*Math.cos(recv.lat*Math.PI/180), ky = 110.57;
  const P0 = f => [cx + (f.lon-recv.lon)*kx*pxPerKm, cy - (f.lat-recv.lat)*ky*pxPerKm];
  const P = f => { let [x,y] = P0(f); const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy);   // keep very close points visible next to the diamond
    if (d < 20){ const a = d ? Math.atan2(dy,dx) : -Math.PI/4; x = cx + 20*Math.cos(a); y = cy + 20*Math.sin(a); } return [x,y]; };
  const r = ringKm*pxPerKm;
  const nearby = [...facilities.values()].filter(f => f.name!==recv.name && hav(recv,f) <= ringKm*1.25);
  const rankOf = id => order.indexOf(id)+1;
  let g = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--tint)" stroke="var(--brand)" stroke-dasharray="4 4"/>`;
  g += `<text x="${cx}" y="${cy-r-5}" text-anchor="middle" font-size="10" fill="var(--text-2)">${R.MAXKM} km estimated road distance</text>`;
  g += nearby.map(f=>{const [x,y]=P(f); return `<circle cx="${x}" cy="${y}" r="3" fill="var(--muted-dot)"/>`}).join("");
  list.forEach(c=>{ const [x,y]=P(c.src); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--brand)" stroke-width="1.2" opacity=".6"/>`; });
  list.forEach(c=>{ const [x,y]=P(c.src); const k = rankOf(c.id);
    g += `<circle cx="${x}" cy="${y}" r="11" fill="var(--brand)" stroke="var(--panel)" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-brand)">${k}</text>`; });
  g += `<rect x="${cx-7}" y="${cy-7}" width="14" height="14" fill="var(--act)" stroke="var(--panel)" stroke-width="2" transform="rotate(45 ${cx} ${cy})"/>`;
  // inset: Tanzania outline
  const minLon=29.2,maxLon=40.6,minLat=-11.9,maxLat=-0.9, iw=78, ih=iw*(maxLat-minLat)/(maxLon-minLon), ix=W_-iw-6, iy=6;
  const IP = (lon,lat)=>[ix+(lon-minLon)/(maxLon-minLon)*iw, iy+(maxLat-lat)/(maxLat-minLat)*ih];
  const path = TZA.map(([lo,la],i)=>{const [x,y]=IP(lo,la);return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)}).join(" ")+"Z";
  const [px,py] = IP(recv.lon, recv.lat);
  g += `<rect x="${ix-4}" y="${iy-4}" width="${iw+8}" height="${ih+8}" fill="var(--panel)" stroke="var(--line)" rx="3"/><path d="${path}" fill="var(--alt)" stroke="var(--text-2)" stroke-width=".8"/><circle cx="${px}" cy="${py}" r="3.5" fill="var(--act)"/>`;
  return `<svg viewBox="0 0 ${W_} ${H_}" role="img" aria-label="Plot of ${esc(recv.name)} and ${list.length} suggested source${list.length===1?"":"s"} within ${R.MAXKM} km">${g}</svg>`;
}

function viewSugg(){
  const need = rows.find(r => r.csvRow===state.alertRow);
  if (!need || need.fac!==state.fac) return `<h1>Suggestions</h1><div class="rule"></div><div class="empty"><strong>Pick an alert first.</strong>Go to Alerts, choose a low or stocked-out item and press “See sources”.<div style="margin-top:var(--space-2)"><button class="btn" data-tab="alerts">Go to Alerts</button></div></div>`;
  const m = match(need), ai = state.ai[need.csvRow] || {};
  const ruleOrder = m.list.map(c=>c.id);
  const order = ai.status==="done" ? ai.order : ruleOrder;
  const byId = Object.fromEntries(m.list.map(c=>[c.id,c]));
  const head = `<h1>Sources for ${esc(need.item)}</h1><div class="rule"></div>
   <div class="need"><div class="facts">
     <div><div class="k">Receiving facility</div><div class="v">${esc(need.fac)}</div></div>
     <div><div class="k">Months of stock</div><div class="v">${fmt1(need.mos)}</div></div>
     <div><div class="k">Needed to reach ${R.MAX} months</div><div class="v">${fmt(m.needQty)} ${esc(need.unit)}</div></div>
   </div><div><button class="btn sec" data-tab="alerts">Back to alerts</button></div></div>`;
  const lo = m.leftOut, loItems = [
    lo.far && `${lo.far} that could supply but ${lo.far>1?"are":"is"} beyond ${R.MAXKM} km`,
    lo.level && `${lo.level} not allowed to supply this facility's level`,
    lo.cap && `${lo.cap} whose stock this facility couldn't use before it expires`,
    lo.expired && `${lo.expired} holding only expired stock`,
    lo.check && `${lo.check} flagged “check quantity”`].filter(Boolean);
  const leftOut = loItems.length ? `<ul class="left-out">${loItems.map(t=>`<li>Left out: ${t}.</li>`).join("")}</ul>` : "";
  if (!m.list.length){
    const nf = m.nearestFar, ns = m.nearestStock;
    let nearest = "";
    if (nf) nearest += `<div class="card" style="margin-top:var(--space-2)"><div class="small muted">Nearest facility that could spare it, beyond the ${R.MAXKM} km limit. Shown for information, not suggested.</div>
      <h3 style="margin-top:4px">${esc(nf.src.name)}</h3><div class="small muted">${esc(nf.src.level||"Level unknown")}</div>
      <div class="figs">
        <div class="fig"><div class="k">Could offer</div><div class="v">${fmt(nf.offer)} ${esc(need.unit)}</div><div class="s">${fmt(nf.row.soh)} in stock, ${fmt1(nf.row.mos)} months; batch expires ${fmtDate(nf.row.expiry)}</div></div>
        <div class="fig"><div class="k">Estimated road distance</div><div class="v">${fmt1(nf.km)} km</div><div class="s">straight line × ${R.ROAD} <span class="tag">estimate</span></div></div>
        <div class="fig"><div class="k">Transport cost</div><div class="v">${tsh(nf.cost)}</div><div class="s">${fmt1(nf.km)} km × 2 (return) × ${tsh(R.RATE)}/km</div></div>
      </div></div>`;
    if (ns && (!nf || ns.src.name !== nf.src.name)) nearest += `<div class="card" style="margin-top:var(--space-2)"><div class="small muted">Nearest facility holding usable stock of this item${nf?"":" anywhere"}. It has none to spare: giving any would leave it short.</div>
      <h3 style="margin-top:4px">${esc(ns.src.name)}</h3><div class="small muted">${esc(ns.src.level||"Level unknown")}</div>
      <div class="figs">
        <div class="fig"><div class="k">Their stock</div><div class="v">${fmt(ns.row.soh)} ${esc(need.unit)}</div><div class="s">${fmt1(ns.row.mos)} months; batch expires ${fmtDate(ns.row.expiry)}</div></div>
        <div class="fig"><div class="k">Estimated road distance</div><div class="v">${fmt1(ns.km)} km</div><div class="s">straight line × ${R.ROAD} <span class="tag">estimate</span></div></div>
      </div></div>`;
    if (!nf && !ns) nearest = `<p class="small muted" style="margin-top:var(--space-2)">No other facility in the data holds usable stock of this item.</p>`;
    return head + `<div class="empty"><strong>No nearby facility can spare this.</strong>No facility within ${R.MAXKM} km estimated road distance holds usable surplus of ${esc(need.item)}. Use the usual resupply route.${leftOut}</div>${nearest}`;
  }

  let aiBlock;
  if (ai.status==="thinking" || !ai.status) aiBlock = `<span class="thinking"><i></i><i></i><i></i> Claude is weighing the options…</span>`;
  else if (ai.status==="done"){
    const same = order.join()===ruleOrder.join();
    aiBlock = `<div class="orders"><div><b>Rule-based order</b><ol>${ruleOrder.map(id=>`<li>${esc(byId[id].src.name)}</li>`).join("")}</ol></div>
      <div><b>Claude's order</b><ol>${order.map(id=>`<li>${esc(byId[id].src.name)}</li>`).join("")}</ol></div>
      <div class="agree">${m.list.length===1?"Only one facility qualifies, so there is nothing to reorder; Claude explains it.": same?"Claude agrees with the rule-based order.":"Claude reorders these. Read its reasons below before choosing."}</div></div>${ai.note?`<p class="small muted">${esc(ai.note)}</p>`:""}`;
  } else aiBlock = `<p class="small muted">${esc(ai.note||"")}</p>${ai.retry?`<button class="btn sec" data-retry="${need.csvRow}">Ask Claude again</button>`:""}`;

  const cards = order.map((id,i)=>{
    const c = byId[id], ruleRank = ruleOrder.indexOf(id)+1;
    const reason = ai.status==="done" ? `<div class="reason"><span class="who">Claude:</span> ${esc(ai.reasons[id])}</div>` : ai.status==="thinking"||!ai.status ? "" : `<div class="reason">${esc(templateReason(c,m.list))}</div>`;
    return `<article class="card${i===0?" top1":""}">
      <div class="head"><span class="rank" aria-label="Rank ${i+1}">${i+1}</span><div style="flex:1">
        <h3>${esc(c.src.name)}</h3><div class="small muted">${esc(c.src.level||"Level unknown")}. Rule-based rank ${ruleRank}.</div></div></div>
      <div class="figs">
        <div class="fig"><div class="k">Can offer</div><div class="v">${fmt(c.offer)} ${esc(need.unit)}</div><div class="s">of ${fmt(c.row.spare)} spare; capped to what you use before expiry and your ${R.MAX}-month maximum</div></div>
        <div class="fig"><div class="k">Their stock</div><div class="v">${fmt(c.row.soh)}</div><div class="s">${fmt1(c.row.mos)} months; batch expires ${fmtDate(c.row.expiry)}</div></div>
        <div class="fig"><div class="k">Estimated road distance</div><div class="v">${fmt1(c.km)} km</div><div class="s">straight line × ${R.ROAD} <span class="tag">estimate</span></div></div>
        <div class="fig"><div class="k">Transport cost</div><div class="v">${tsh(c.cost)}</div><div class="s">${fmt1(c.km)} km × 2 (return) × ${tsh(R.RATE)}/km</div></div>
      </div>
      <div class="small muted">Commodity value not included: unit costs not available yet.</div>
      ${reason}
      <div class="row" style="margin-top:var(--space-2)"><button class="btn" data-pick="${id}" ${state.canWrite?"":"disabled"}>Request from this facility</button></div>
    </article>`;
  }).join("");
  return head + `<div class="row" style="margin-bottom:var(--space-2)"><span class="tag ai">Ranked with Claude</span><span class="small muted">Every figure comes from the tool's own calculation; Claude only orders the list and writes the reason.</span></div>
   ${aiBlock}
   <div class="sgrid"><div class="cards">${cards}${leftOut}</div>
   <div class="mapbox">${mapSvg(need, m.list, order)}<div class="mapcap">Facility coordinates plotted as points; a source very close by is drawn just outside the diamond. Diamond: ${esc(need.fac)}. Numbered: suggested sources. Grey: other facilities nearby. No map tiles.</div></div></div>`;
}

const REQ_STEPS = [["sent","Request sent"],["accepted","Supplier confirms and accepts"],["approved","Supplier's in-charge approves"]];
function stepState(r){
  const s = r.status;
  const idx = {sent:0, accepted:1, approved:2, declined:1, rejected:2}[s];
  return REQ_STEPS.map(([k,l],i)=>{
    let cls = i<idx ? "done" : i===idx ? "now" : "";
    let label = l;
    if (s==="declined" && i===1){ cls="bad"; label="Supplier declined"; }
    if (s==="rejected" && i===2){ cls="bad"; label="In-charge rejected"; }
    if (s==="approved" && i===2) cls="done";
    if (s==="accepted" && i===1) cls="done";
    if (s==="sent" && i===0) cls="done";
    return `<li class="${cls}">${label}</li>`;
  }).join("");
}
function viewReq(){
  let html = `<h1>Request and approval</h1><div class="rule"></div>
  <p class="lede">Nothing moves until the supplying facility confirms the quantity it really has and accepts, and its in-charge approves. Switch “Acting as” to see each side.</p>`;
  html += storeBanner();
  // new request form
  const need = rows.find(r => r.csvRow===state.alertRow);
  if (state.pick && need && need.fac===state.fac){
    const c = match(need).list.find(x=>x.id===state.pick);
    if (c){
      const q = state.draftQty ?? c.offer;
      html += `<section class="panel"><h2 style="margin-top:0">New request</h2>
      <p>${esc(need.item)} from <b>${esc(c.src.name)}</b> to <b>${esc(need.fac)}</b>.</p>
      <div class="form">
        <label>Quantity (${esc(need.unit)})<input type="number" id="qty" min="1" max="${c.offer}" value="${q}"><span class="help">Prefilled with what ${esc(need.fac)} can use before the batch expires on ${fmtDate(c.row.expiry)}: up to ${fmt(c.offer)}.</span></label>
        <label>Note to the supplying facility (optional)<textarea id="note" rows="2" maxlength="300"></textarea></label>
        <div class="small muted">Estimated road distance ${fmt1(c.km)} km. Transport ${tsh(c.cost)} (${fmt1(c.km)} km × 2 return × ${tsh(R.RATE)}/km).</div>
        <div class="row"><button class="btn" id="send" ${state.canWrite?"":"disabled"}>Send request</button><button class="btn quiet" id="cancelPick">Cancel</button></div>
      </div></section>`;
    }
  }
  const mine = myRequests();
  const incoming = mine.filter(r=>r.fromFac===state.fac), outgoing = mine.filter(r=>r.toFac===state.fac);
  html += `<h2>Incoming requests (${incoming.length})</h2>` + (incoming.length? incoming.map(reqCard).join("") : `<p class="muted">No facility has asked ${esc(state.fac)} for stock.</p>`);
  html += `<h2>Requests you sent (${outgoing.length})</h2>` + (outgoing.length? outgoing.map(reqCard).join("") : `<p class="muted">None yet. Start from an alert on the Alerts screen.</p>`);
  return html;
}
function reqCard(r){
  const incoming = r.fromFac===state.fac;
  let action = "";
  if (incoming && r.status==="sent"){
    action = state.role==="staff"
      ? `<div class="panel"><div class="form"><label>Quantity you actually have to give (${esc(r.unit)})<input type="number" min="1" id="cq-${r.id}" value="${r.qtyRequested}"><span class="help">Check the shelf, not just EMR. The tool's figure may be wrong.</span></label>
         <div class="row"><button class="btn" data-accept="${r.id}" ${state.canWrite?"":"disabled"}>Accept</button><button class="btn sec" data-decline="${r.id}" ${state.canWrite?"":"disabled"}>Decline</button></div></div></div>`
      : `<div class="who-note">Waiting for ${esc(r.fromFac)} staff to confirm the quantity. Switch role to Staff to do this.</div>`;
  } else if (incoming && r.status==="accepted"){
    action = state.role==="incharge"
      ? `<div class="panel"><p>Staff confirmed <b>${fmt(r.qtyConfirmed)} ${esc(r.unit)}</b>. As in-charge of ${esc(r.fromFac)}, approve the transfer?</p><div class="row"><button class="btn" data-approve="${r.id}" ${state.canWrite?"":"disabled"}>Approve</button><button class="btn sec" data-reject="${r.id}" ${state.canWrite?"":"disabled"}>Reject</button></div></div>`
      : `<div class="who-note">Waiting for the in-charge of ${esc(r.fromFac)} to approve. Switch role to Facility in-charge to do this.</div>`;
  } else if (!incoming && (r.status==="sent"||r.status==="accepted")){
    action = `<div class="who-note">Waiting for ${esc(r.fromFac)}. <button class="btn quiet" data-as="${esc(r.fromFac)}|${r.status==="sent"?"staff":"incharge"}">Act as ${esc(r.fromFac)} ${r.status==="sent"?"staff":"in-charge"}</button></div>`;
  } else if (r.status==="approved"){
    action = `<div class="row"><button class="btn sec" data-tab="xfer">Arrange the transfer</button></div>`;
  }
  return `<article class="req"><div class="title"><h3>${esc(r.item)}</h3><span class="small muted">${fmtDate(new Date(r.created))}</span></div>
    <div class="small">${esc(r.fromFac)} → ${esc(r.toFac)}. Requested ${fmt(r.qtyRequested)} ${esc(r.unit)}${r.qtyConfirmed!=null?`, confirmed ${fmt(r.qtyConfirmed)}`:""}. Estimated ${fmt1(r.km)} km, ${tsh(r.cost)} transport.</div>
    ${r.note?`<div class="small muted">Note: ${esc(r.note)}</div>`:""}
    <ol class="steps">${stepState(r)}</ol>${action}
    ${(r.log||[]).length?`<ul class="log">${r.log.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:""}</article>`;
}

const XFER = [["agreed","Transfer agreed"],["road","On the road"],["received","Collected / received"]];
function viewXfer(){
  const list = myRequests().filter(r=>r.status==="approved");
  let html = `<h1>Transfer</h1><div class="rule"></div><p class="lede">The two facilities agree who arranges transport. Mark the stock as collected or received to close the loop.</p>${storeBanner()}`;
  if (!list.length) return html + `<div class="empty"><strong>No approved transfers for ${esc(state.fac)}.</strong>A transfer appears here once the supplying facility's in-charge approves a request.<div style="margin-top:var(--space-2)"><button class="btn sec" data-tab="req">Go to requests</button></div></div>`;
  return html + list.map(r=>{
    const t = r.transfer || "agreed", ti = XFER.findIndex(x=>x[0]===t);
    const arr = r.arranger ? (r.arranger==="to" ? r.toFac : r.fromFac) : null;
    const msg = `To the driver, from ${r.fromFac} (supplying facility):
Collect ${fmt(r.qtyConfirmed)} ${r.unit} of ${r.item}
from ${r.fromFac}
deliver to ${r.toFac}.
Estimated road distance ${fmt1(r.km)} km (return trip ${fmt1(r.km*2)} km).
Transport cost ${tsh(r.cost)} at ${tsh(R.RATE)}/km.
Transport arranged by: ${arr || "not chosen yet"}.
Logistics support: ${r.logistics || "none noted"}.`;
    const isSupplier = state.fac === r.fromFac;
    const noteText = state.noteDrafts[r.id] ?? r.pickupNote ?? msg;
    let msgBlock;
    if (r.noteSent){
      msgBlock = `<div style="margin-top:var(--space-2)"><span class="tag mock">Simulated: no SMS left the prototype</span></div>
        <p class="small" style="margin:6px 0 0"><b>Pickup message sent to the driver</b> by ${esc(r.noteSentBy)} on ${fmtDate(new Date(r.noteSent))}.</p>
        <details style="margin-top:6px;padding:var(--space-1) var(--space-2)"><summary class="small">View the message</summary><div class="outbox">${esc(r.pickupNote)}</div></details>`;
    } else if (state.canWrite){
      msgBlock = `<div style="margin-top:var(--space-2)"><span class="tag mock">Mocked: sending is simulated, no SMS is sent</span></div>
        <label class="small" style="display:grid;gap:4px;margin-top:var(--space-1);font-weight:600">Pickup message to the driver. Edit it, then send.${isSupplier?"":` <span class="muted" style="font-weight:400">Usually sent by ${esc(r.fromFac)} (supplying); either facility can send it here.</span>`}
        <textarea rows="8" data-note="${r.id}" style="font-size:13px;font-weight:400">${esc(noteText)}</textarea></label>
        <div class="row" style="margin-top:var(--space-1)"><button class="btn" data-send="${r.id}">Send message</button>
        ${(state.noteDrafts[r.id] ?? r.pickupNote) != null ? `<button class="btn quiet" data-renote="${r.id}">Use the generated text again</button>` : ""}
</div>`;
    } else {
      msgBlock = `<div style="margin-top:var(--space-2)"><span class="tag mock">Mocked: sending is simulated, no SMS is sent</span> <span class="small muted">Draft pickup message. ${esc(r.fromFac)} (supplying) edits and sends it.</span></div>
        <div class="outbox">${esc(noteText)}</div>
        ${isSupplier ? "" : `<button class="btn quiet" data-as="${esc(r.fromFac)}|staff|xfer">Act as ${esc(r.fromFac)} staff</button>`}`;
    }
    const next = XFER[ti+1];
    return `<article class="req"><div class="title"><h3>${esc(r.item)}</h3><span class="small muted">${esc(r.fromFac)} → ${esc(r.toFac)}</span></div>
      <div class="figs">
        <div class="fig"><div class="k">Quantity</div><div class="v">${fmt(r.qtyConfirmed)} ${esc(r.unit)}</div></div>
        <div class="fig"><div class="k">Estimated road distance</div><div class="v">${fmt1(r.km)} km</div><div class="s">straight line × ${R.ROAD}</div></div>
        <div class="fig"><div class="k">Transport cost</div><div class="v">${tsh(r.cost)}</div><div class="s">${fmt1(r.km)} km × 2 (return) × ${tsh(R.RATE)}/km</div></div>
      </div>
      <ol class="steps">${XFER.map(([k,l],i)=>`<li class="${i<ti||t==="received"?"done":i===ti?"now":""}">${l}</li>`).join("")}</ol>
      ${t!=="received"?`<div class="form">
        <label>Who arranges transport?<select data-arr="${r.id}" ${state.canWrite?"":"disabled"}><option value="">Choose…</option><option value="to" ${r.arranger==="to"?"selected":""}>${esc(r.toFac)} (requesting)</option><option value="from" ${r.arranger==="from"?"selected":""}>${esc(r.fromFac)} (supplying)</option></select></label>
        <label>Logistics support needed<input type="text" maxlength="120" data-log="${r.id}" value="${esc(r.logistics||"")}" placeholder="For example: cold box, motorbike, vehicle" ${state.canWrite?"":"disabled"}></label>
      </div>`:""}
      ${msgBlock}
      <div class="row" style="margin-top:var(--space-2)">${next?`<button class="btn${r.noteSent?"":" sec"}" data-xfer="${r.id}|${next[0]}" ${state.canWrite&&r.arranger?"":"disabled"}>Mark ${next[1].toLowerCase()}</button>${r.arranger?"":`<span class="small muted">Choose who arranges transport first.</span>`}`:`<b>Done. Stock ${t==="received"?"collected / received":""}. Updating EMR stock records is a later step.</b>`}</div>
      ${(r.log||[]).length?`<ul class="log">${r.log.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:""}
    </article>`;
  }).join("");
}
function storeBanner(){
  let b = "";
  if (state.store==="local") b += `<div class="banner">Shared storage isn't available in this view, so requests are kept only in this browser tab and vanish on reload.</div>`;
  if (!state.canWrite) b += `<div class="banner">You can view requests but not change them with your access to this page.</div>`;
  return b;
}
function aboutPanel(){
  const S = (k,v)=>`<tr><th scope="row">${k}</th><td>${v}</td></tr>`;
  return `<details><summary>What is real and what is mocked in this prototype</summary>
  <div class="scrollx"><table class="table">
  ${S("Months of stock and flags","Calculated by the tool from the synthetic EMR snapshot (223 records: the original 216 plus 7 nearby surplus records added for the demo).")}
  ${S("Level eligibility","Real rule, <span class=\"tag\">assumed table — confirm</span>: hospitals supply all levels below them; health centres supply health centres and dispensaries; dispensaries supply dispensaries and health centres.")}
  ${S("Distance","<span class=\"tag\">estimate</span> Straight line between coordinates × ${R.ROAD}, labelled “estimated road distance”. Real road distance needs a routing service (openrouteservice).")}
  ${S("Transport cost","Calculated: distance × 2 (return) × ${tsh(R.RATE)}/km. Commodity value is not included.")}
  ${S("Ranking","<span class=\"tag ai\">Claude</span> Live call on the filtered shortlist only, side by side with the rule-based order (${W.cover*100}% need covered, ${W.dist*100}% distance, ${W.expiry*100}% source stock expiring within 6 months).")}
  ${S("Requests and approval","Real, stored and shared between viewers. “Acting as” stands in for accounts.")}
  ${S("Transport","<span class=\"tag mock\">Mocked</span> The pickup note is shown, not sent. Status is set by hand.")}
  ${S("Data handling","${skipped.length} empty record skipped (CSV row ${skipped.map(s=>s.csvRow).join(", ")}). ${merged.length} duplicate merged (row ${merged.map(m=>m.csvRow).join(", ")}, “Kilombero Disp. 065”). Expired stock never offered. Above ${R.CHECK} months held for a quantity check.")}
  </table></div></details>`;
}

function render(){
  renderActing(); renderTabs();
  const v = state.tab==="alerts"?viewAlerts(): state.tab==="sugg"?viewSugg(): state.tab==="req"?viewReq(): viewXfer();
  $("#main").innerHTML = v;
}
function go(tab){ state.tab = tab; render(); window.scrollTo({top:0}); if (tab==="sugg"){ const n = rows.find(r=>r.csvRow===state.alertRow); if (n && n.fac===state.fac) askClaude(n); } }

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.fac){ state.fac = d.fac; state.role="staff"; rememberActing(); return go("alerts"); }
  if (d.open){ state.alertRow = Number(d.open); state.pick=null; return go("sugg"); }
  if (d.retry){ delete state.ai[Number(d.retry)]; const n = rows.find(r=>r.csvRow===Number(d.retry)); return askClaude(n); }
  if (d.pick){ state.pick = d.pick; state.draftQty = null; return go("req"); }
  if (d.as){ const [f,r,tb] = d.as.split("|"); state.fac=f; state.role=r; rememberActing(); return go(tb||"req"); }
  if (t.id==="cancelPick"){ state.pick=null; return render(); }
  if (t.id==="send"){
    const need = rows.find(r=>r.csvRow===state.alertRow); const m = match(need); const c = m.list.find(x=>x.id===state.pick);
    const q = Math.floor(Number($("#qty").value));
    if (!(q>=1 && q<=c.offer)){ toast(`Enter a quantity from 1 to ${fmt(c.offer)}.`); return; }
    const ai = state.ai[need.csvRow];
    t.disabled = true;
    const id = await addRequest({ item:need.item, unit:need.unit, toFac:need.fac, fromFac:c.src.name, qtyRequested:q, qtyConfirmed:null,
      km:c.km, cost:c.cost, sourceBatch:c.row.batch, sourceExpiry:c.row.expiry.toISOString().slice(0,10), note:$("#note").value.trim().slice(0,300),
      claudeRank: ai?.status==="done" ? ai.order.indexOf(c.id)+1 : null, ruleRank: m.list.indexOf(c)+1,
      status:"sent", created:Date.now(), log:[`Request for ${q} sent by ${need.fac} staff.`] });
    if (id){ state.pick=null; toast("Request sent."); render(); }
    return;
  }
  if (d.accept){ const r = state.requests.find(x=>x.id===d.accept); const q = Math.floor(Number($("#cq-"+d.accept).value));
    if (!(q>=1)){ toast("Enter the quantity you can give."); return; }
    return patchRequest(d.accept, {status:"accepted", qtyConfirmed:q, _log:`${r.fromFac} staff confirmed ${q} and accepted.`}); }
  if (d.decline){ const r = state.requests.find(x=>x.id===d.decline); return patchRequest(d.decline, {status:"declined", _log:`${r.fromFac} staff declined.`}); }
  if (d.approve){ const r = state.requests.find(x=>x.id===d.approve); return patchRequest(d.approve, {status:"approved", transfer:"agreed", _log:`${r.fromFac} in-charge approved.`}); }
  if (d.reject){ const r = state.requests.find(x=>x.id===d.reject); return patchRequest(d.reject, {status:"rejected", _log:`${r.fromFac} in-charge rejected.`}); }
  if (d.send){ const ta = document.querySelector(`textarea[data-note="${d.send}"]`); const text = (ta ? ta.value : "").trim().slice(0,1000);
    if (!text){ toast("Write the message before sending."); return; }
    delete state.noteDrafts[d.send];
    await patchRequest(d.send, {pickupNote:text, noteSent:Date.now(), noteSentBy:state.fac, _log:`Pickup message sent to the driver by ${state.fac} (simulated).`});
    toast("Message sent (simulated)."); return; }
  if (d.renote){ delete state.noteDrafts[d.renote]; const r = state.requests.find(x=>x.id===d.renote);
    if (r && r.pickupNote!=null) await patchRequest(d.renote, {pickupNote:null}); else render(); return; }
  if (d.xfer){ const [id,step] = d.xfer.split("|"); const lbl = XFER.find(x=>x[0]===step)[1].toLowerCase();
    return patchRequest(id, {transfer:step, _log:`Marked ${lbl} by ${state.fac}.`}); }
});
document.addEventListener("input", e => { const t = e.target; if (t.dataset && t.dataset.note) state.noteDrafts[t.dataset.note] = t.value; });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id==="asFac"){ state.fac = t.value; rememberActing(); return go(state.tab==="sugg"?"alerts":state.tab); }
  if (t.id==="asRole"){ state.role = t.value; rememberActing(); return render(); }
  if (t.dataset.arr){ const r = state.requests.find(x=>x.id===t.dataset.arr); const who = t.value==="to"?r.toFac:r.fromFac;
    if (t.value) patchRequest(t.dataset.arr, {arranger:t.value, _log:`${who} will arrange transport.`}); }
  if (t.dataset.log){ patchRequest(t.dataset.log, {logistics:t.value.trim().slice(0,120)}); }
  if (t.id==="qty"){ state.draftQty = Number(t.value); }
});

$("#updated").textContent = "Last updated on " + fmtDate(SNAPSHOT);
render();
initStore();
</script>
</body>
</html>
